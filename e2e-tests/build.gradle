plugins {
    id 'groovy'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Disable bootJar since this is a test-only module
bootJar {
    enabled = false
}

jar {
    enabled = true
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

clean.doFirst {
    delete fileTree(projectDir) { include '.attach_pid*' }
}

tasks.register('e2eTest', Test) {
    description = "Runs e2e Tests."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
}

test {
    enabled = false
}

dependencies {
    testImplementation project(path: ':test-utils', configuration: 'default')
    testImplementation 'org.apache.groovy:groovy:4.0.25'
    testImplementation 'org.spockframework:spock-core:2.4-M4-groovy-4.0'
}