plugins {
    id 'groovy'
    id 'application'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'pl.jojczykp.kafka_cqrs.persister.PersisterServiceMain'
}

tasks.register('buildDockerImage', Exec) {
    dependsOn distTar
    executable 'sh'
    args '-c', "docker build -t jojczykp.pl/kafka-cqrs/${project.name}:0.0.1 ."
}

clean.doFirst {
    delete fileTree(projectDir) { include '.attach_pid*' }
}

test {
    useJUnitPlatform()
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    compileOnly 'org.projectlombok:lombok:1.18.36'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.data:spring-data-cassandra'
    implementation('org.apache.cassandra:java-driver-core:4.18.1') {
        exclude group: 'com.datastax.oss', module: 'java-driver-shaded-guava'
    }

    implementation 'com.google.guava:guava:33.4.0-jre'

    testImplementation project(path: ':test-utils', configuration: 'default')
    testImplementation 'org.apache.groovy:groovy:4.0.25'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.spockframework:spock-spring:2.4-M4-groovy-4.0'
    testImplementation 'org.junit.platform:junit-platform-engine:1.11.3'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.11.3'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:testcontainers:2.0.3'
    testImplementation 'org.testcontainers:testcontainers-cassandra:2.0.3'
    testImplementation 'org.testcontainers:testcontainers-spock:2.0.3'
}
