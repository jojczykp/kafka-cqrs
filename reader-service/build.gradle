plugins {
    id 'groovy'
    id 'application'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.compilerArgs += ['-parameters']
}

application {
    mainClass = 'pl.jojczykp.kafka_cqrs.reader.ReaderServiceMain'
}

tasks.register('buildDockerImage', Exec) {
    dependsOn distTar
    executable 'sh'
    args '-c', "docker build -t jojczykp.pl/kafka-cqrs/${project.name}:0.0.1 ."
}

test {
    useJUnitPlatform()
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    compileOnly 'org.projectlombok:lombok:1.18.36'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.data:spring-data-cassandra'

    testImplementation 'org.apache.groovy:groovy:4.0.25'
    testImplementation 'org.apache.groovy:groovy-json:4.0.25'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.spockframework:spock-spring:2.4-M4-groovy-4.0'
    testImplementation 'org.junit.platform:junit-platform-engine:1.11.3'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.11.3'
    testImplementation 'org.testcontainers:testcontainers:2.0.3'
    testImplementation 'org.testcontainers:testcontainers-cassandra:2.0.3'
    testImplementation 'org.testcontainers:testcontainers-spock:2.0.3'
    testImplementation 'org.apache.commons:commons-lang3:3.17.0'
}
