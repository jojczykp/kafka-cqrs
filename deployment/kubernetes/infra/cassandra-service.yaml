apiVersion: v1
kind: Service
metadata:
  name: cassandra-service
  labels:
    app: kafka-cqrs
spec:
  type: LoadBalancer
  selector:
    app: kafka-cqrs
    service: cassandra-service
  ports:
  - name: cassandra-service-port
    protocol: TCP
    port: 9042
    targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-cqrs-cassandra-service
  labels:
    app: kafka-cqrs
    service: cassandra-service
spec:
  serviceName: cassandra-service
  selector:
    matchLabels:
      app: kafka-cqrs
      service: cassandra-service
  replicas: 1
  template:
    metadata:
      labels:
        app: kafka-cqrs
        service: cassandra-service
    spec:
      containers:
      - name: kafka-service
        image: library/cassandra:4.0-rc1
        ports:
          - containerPort: 9042
        env:
          - name: CASSANDRA_ENDPOINT_SNITCH
            value: "GossipingPropertyFileSnitch"
          - name: CASSANDRA_DC
            value: datacenter1
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                until cqlsh -e "DESCRIBE KEYSPACES" 2>/dev/null; do
                  echo "Waiting for Cassandra to be ready..."
                  sleep 2
                done
                echo "Creating keyspace and table..."
                cqlsh -e "CREATE KEYSPACE IF NOT EXISTS documents WITH REPLICATION = {'class': 'SimpleStrategy', 'replication_factor': 1};"
                cqlsh -e "CREATE TABLE IF NOT EXISTS documents.documents (id uuid PRIMARY KEY, author text, text text);"
                echo "Cassandra schema initialized"
        readinessProbe:
          tcpSocket:
            port: 9042
          initialDelaySeconds: 1
          periodSeconds: 1
